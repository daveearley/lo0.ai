name: release

# A v* tag runs the whole of ci.yml at that commit, publishes the very
# binaries it tested, then installs the release from lo0.ai on every
# platform the way the README says to.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  on-main:
    name: the tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A release is a commit main already has, never one from a branch.
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: on-main
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # install.sh and install.ps1 look the binaries up by these names in
      # checksums.txt, which make dist wrote.
      - name: The binaries are the ones CI tested
        run: cd dist && sha256sum -c checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/lo0-*
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  quickstart:
    needs: publish
    uses: ./.github/workflows/quickstart.yml
    with:
      version: ${{ github.ref_name }}

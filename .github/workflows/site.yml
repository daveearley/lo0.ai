name: site

# The site serves install.sh and install.ps1, which ci.yml tests against the
# release binaries, so main deploys only after ci.yml passes on that commit.

on:
  pull_request:
    paths:
      - 'site/**'
      - 'internal/**'
      - 'cmd/lo0wasm/**'
      - '.github/workflows/site.yml'
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # workflow_run carries secrets, so deploy only for a push to this
    # repository, never for a pull request from a fork whose branch is main.
    if: >-
      github.event_name == 'pull_request' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build lo0 for the hardware page
        run: make wasm
        working-directory: .
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        if: github.event_name == 'workflow_run'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
